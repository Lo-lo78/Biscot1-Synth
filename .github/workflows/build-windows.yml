name: Build Biscot1 VST3 Windows x64
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022 # VS 2022; windows-latest currently uses VS 2026
    steps:
      - uses: actions/checkout@v4
      - name: Verify factory reset, tracker Backspace and Ping Pong stereo handling
        shell: pwsh
        run: python Tests/verify_test0244_factory_pingpong.py
      - name: Check host Song Trigger automation and transport edge integration
        shell: pwsh
        run: python Tests/verify_test0243_host_song_trigger.py
      - name: Validate release-number consistency before the regression tests
        shell: pwsh
        run: python Tests/verify_release_version_consistency.py
      - name: Guard mixed-type preset controls (MSVC C3535 / C2440 / C2665)
        shell: pwsh
        run: python Tests/verify_test0241_preset_browser_msvc_buttons.py
      - name: Guard const-correct Pattern cursor access (MSVC C2662 regression)
        shell: pwsh
        run: python Tests/verify_test0238_pattern_const_correctness.py
      - name: Verify unified Ctrl+arrow navigation in F1 Pattern and F2 Song
        shell: pwsh
        run: python Tests/verify_test0242_tracker_ctrl_arrows.py
      - name: Verify silent F2 Song parameter-picker borders
        shell: pwsh
        run: python Tests/verify_test0240_song_picker_silent_edges.py
      - name: Guard atomic Song import, Yes/No dialogs and tracker cursor persistence
        shell: pwsh
        run: python Tests/verify_test0239_atomic_song_replace_accessibility.py
      - name: Validate JSFX parameter map
        shell: pwsh
        run: python Tests/verify_catalog.py
      - name: Validate editor structure and DSP coverage
        shell: pwsh
        run: python Tests/check_test02.py
      - name: Validate Windows build configuration
        shell: pwsh
        run: python Tests/verify_build_configuration.py
      - name: Validate JUCE 8 compiler compatibility fixes
        shell: pwsh
        run: python Tests/verify_test021_build_fixes.py
      - name: Validate output stage and navigation
        shell: pwsh
        run: python Tests/verify_test022.py
      - name: Validate MIDI pitch bend modes
        shell: pwsh
        run: python Tests/verify_pitch_bend_mode.py
      - name: Verify preset browser and accessible editor
        shell: pwsh
        run: python Tests/verify_test025.py
      - name: Verify Grid NVDA navigation speech
        shell: pwsh
        run: python Tests/verify_test0251_grid_speech.py
      - name: Validate MIDI held-note stack integration
        shell: pwsh
        run: python Tests/verify_test026_note_stack.py
      - name: Validate SID Seq memory integration
        shell: pwsh
        run: python Tests/verify_test027_sidseq.py
      - name: Validate per-operator sustain and ADSR migration
        shell: pwsh
        run: python Tests/verify_test028_sustain.py
      - name: Validate Chord master and sustained arpeggiators
        shell: pwsh
        run: python Tests/verify_test029_arp_chord_master.py
      - name: Validate quantized arp Trigger / Legato transport and Release
        shell: pwsh
        run: python Tests/verify_test0210_quantized_arp.py
      - name: Validate TEST0.2.13 arpeggiator transport and Release
        shell: pwsh
        run: python Tests/verify_test0211_arp_transport.py
      - name: Verify arpeggio clock during release
        shell: pwsh
        run: python Tests/verify_test0212_arp_release.py
      - name: Verify TEST0.2.13 smooth CC64 arpeggio release
        shell: pwsh
        run: python Tests/verify_test0213_pedal_click.py
      - name: Verify JSFX filter gate and LFO parity wiring
        shell: pwsh
        run: python Tests/verify_test0214_filter_lfo.py
      - name: Verify point 4 cold idle, Square PWM and focus routing
        shell: pwsh
        run: python Tests/verify_test0215_idle_pwm.py
      - name: Verify TEST0.2.18 idle and arp pool optimization
        shell: pwsh
        run: python Tests/verify_test0216_deep_idle.py
      - name: Verify LB-303-style silent accessible editor root
        shell: pwsh
        run: python Tests/verify_test0217_nvda_entry.py
      - name: Verify first parameter and persisted UI location
        shell: pwsh
        run: python Tests/verify_test02171_initial_selection.py
      - name: Verify native tracker integration and original DSP preservation
        shell: pwsh
        run: python Tests/verify_test0218_tracker.py
      - name: Verify TEST0.2.18.2 tracker keyboard search and selection
        shell: pwsh
        run: python Tests/verify_test02182_tracker_navigation.py
      - name: Verify Release test assertions are always executed
        shell: pwsh
        run: python Tests/verify_test02183_release_tests.py
      - name: Verify F1 clipboard keyboard routing and Lua navigation
        shell: pwsh
        run: python Tests/verify_test02184_f1_clipboard.py
      - name: Verify Pattern audio transport and F2 parameter event routing
        shell: pwsh
        run: python Tests/verify_test0219_pattern_play.py
      - name: Verify tracker choice labels and logical step cursor
        shell: pwsh
        run: python Tests/verify_test02191_tracker_labels.py
      - name: Verify F1 logical cursor and same-parameter navigation
        shell: pwsh
        run: python Tests/verify_test02192_cell_navigation.py
      - name: Verify Lua-compatible step preview on parameter edits
        shell: pwsh
        run: python Tests/verify_test02193_value_audition.py
      - name: Verify F1 1/2/3 section shortcuts and Song-lane semantics
        shell: pwsh
        run: python Tests/verify_test02194_section_digits.py
      - name: Verify F1 numeric Alt+E and Enter parameter picker
        shell: pwsh
        run: python Tests/verify_test02195_enter_value.py
      - name: Verify Lua-style Previous Value, Curve and parameter insertion rules
        shell: pwsh
        run: python Tests/verify_test0220_curve_prev.py
      - name: Verify remapped F1 Enter / Alt+E and reserved Song F2
        shell: pwsh
        run: python Tests/verify_test02201_enter_picker.py
      - name: Verify TEST0.2.21.4 MIDI release latch and F1 header navigation
        shell: pwsh
        run: python Tests/verify_test02211_release_header.py
      - name: Verify F1 paste and parameter picker insert at selected cell
        shell: pwsh
        run: python Tests/verify_test02212_insertion_position.py
      - name: Verify TEST0.2.21.4 F1 area navigation and Pattern library export
        shell: pwsh
        run: python Tests/verify_test02214_home_export.py
      - name: Validate TEST0.2.24 Song F2 state and keyboard integration
        shell: pwsh
        run: python Tests/verify_test0222_song_editor.py
      - name: Validate TEST0.2.24 Song F2 edit commands and safe serialization
        shell: pwsh
        run: python Tests/verify_test0223_song_editing.py
      - name: Verify Song sample-clock playback, three-lane MIDI and accessible transport
        shell: pwsh
        run: python Tests/verify_test0224_song_playback.py
      - name: Verify Song End chaining, blank-row FX and shared owner routing
        shell: pwsh
        run: python Tests/verify_test0225_song_engine.py
      - name: Verify TEST0.2.39 Song End, previews and accessible return focus
        shell: pwsh
        run: python Tests/verify_test0226_song_chain_preview.py
      - name: Verify TEST0.2.39 Song and Pattern library import/export
        shell: pwsh
        run: python Tests/verify_test0227_song_library.py
      - name: Verify TEST0.2.39 self-contained Song bundles and library folders
        shell: pwsh
        run: python Tests/verify_test0228_self_contained.py
      - name: Verify TEST0.2.39 Song editor balanced C++ blocks
        shell: pwsh
        run: python Tests/verify_test0231_song_panel_syntax.py
      - name: Verify independent single Song and fixed 100-Song bank packages
        shell: pwsh
        run: python Tests/verify_test0230_song_library_modes.py
      - name: Verify all Song exports and embedded Patterns
        shell: pwsh
        run: python Tests/verify_test0229_all_songs.py
      - name: Verify named library save, keyboard focus and spoken spaces
        shell: pwsh
        run: python Tests/verify_test0232_named_library_accessibility.py
      - name: Validate incremental library and preset search / remembered preview
        shell: pwsh
        run: python Tests/verify_test0234_browser_search_preview.py
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 4
      - name: Verify faithful file audition without mutating Patterns or Song timeline
        shell: pwsh
        run: python Tests/verify_test0235_faithful_file_preview.py
      - name: Test actual stereo ping pong delay alternation
        shell: pwsh
        run: .\build\Release\TrackerSongPingPongTest.exe
      - name: Test three-operator Song library preview matches loaded arrangement
        shell: pwsh
        run: .\build\Release\TrackerSongLibraryPreviewTest.exe
      - name: Test real Song End transition and per-step operator-only preview
        shell: pwsh
        run: .\build\Release\TrackerSongEndPreviewTest.exe
      - name: Test Song End, shared resource ownership, Sidechain and Delay in Release
        shell: pwsh
        run: .\build\Release\TrackerSongAdvancedTest.exe
      - name: Test three independent Song lanes and window/repeat timing in Release
        shell: pwsh
        run: .\build\Release\TrackerSongPlaybackTest.exe
      - name: Test Song F2 clipboard, reorder and per-Song Undo Redo in Release
        shell: pwsh
        run: .\build\Release\TrackerSongEditingTest.exe
      - name: Test native Song bank and ordered F4 parameter groups
        shell: pwsh
        run: .\build\Release\TrackerSongBankTest.exe
      - name: Test JSFX SID filter and wavetable core
        shell: pwsh
        run: .\build\Release\SidCoreStandaloneTest.exe
      - name: Test MIDI Pitch Bend routing
        shell: pwsh
        run: .\build\Release\PitchBendRoutingTest.exe
      - name: Test MIDI held-note stacks, legato, chord routing
        shell: pwsh
        run: .\build\Release\SidMidiNoteStateTest.exe
      - name: Test JSFX SID Seq recording and clock
        shell: pwsh
        run: .\build\Release\SidSeqMemoryTest.exe
      - name: Test full arpeggio chord through manual release
        shell: pwsh
        run: .\build\Release\SidArpReleaseLatchTest.exe
      - name: Test F1 selected-cell insertion and dependent parameter order
        shell: pwsh
        run: .\build\Release\TrackerInsertionPositionTest.exe
      - name: Test F1 repeat/header shortcuts and remembered step
        shell: pwsh
        run: .\build\Release\TrackerHeaderNavigationTest.exe
      - name: Test ADSR and per-operator sustain regression
        shell: pwsh
        run: .\build\Release\SidSustainPedalTest.exe
      - name: Test CC64 arp continuation and Chord master
        shell: pwsh
        run: .\build\Release\SidArpSustainTest.exe
      - name: Test clock quantization, musical Trigger and natural Release
        shell: pwsh
        run: .\build\Release\SidQuantizedArpTest.exe
      - name: Test SID Seq and classical arp continue through Release
        shell: pwsh
        run: .\build\Release\SidArpReleaseTest.exe
      - name: Test CC64 release pitch and classical arp memory continuity
        shell: pwsh
        run: .\build\Release\SidPedalReleaseContinuityTest.exe
      - name: Test JSFX LFO shapes, Delay, Trigger, One Shot and filter ADSR
        shell: pwsh
        run: .\build\Release\SidFilterLfoParityTest.exe
      - name: Test point 4 idle DSP and LFO Square PWM
        shell: pwsh
        run: .\build\Release\SidIdleAndSquarePwmTest.exe
      - name: Test zero-work idle and arp pool refresh
        shell: pwsh
        run: .\build\Release\SidDeepIdleCpuTest.exe
      - name: Test native Pattern memory and limits
        shell: pwsh
        run: .\build\Release\TrackerPatternBankTest.exe
      - name: Test F2 incremental search and F1 multi-step copy
        shell: pwsh
        run: .\build\Release\TrackerSearchStepTest.exe
      - name: Test F1 Windows Ctrl shortcut key mapping and full Pattern copy
        shell: pwsh
        run: .\build\Release\TrackerShortcutTest.exe
      - name: Test native tracker Pattern clock and cursor pause
        shell: pwsh
        run: .\build\Release\TrackerPatternPlaybackTest.exe
      - name: Test tracker choice labels and logical F1 column in Release
        shell: pwsh
        run: .\build\Release\TrackerCellPresentationTest.exe
      - name: Test F1 cursor persistence and same-parameter navigation
        shell: pwsh
        run: .\build\Release\TrackerCellNavigationTest.exe
      - name: Test Note/Gate/Filter/LFO edit audition policy
        shell: pwsh
        run: .\build\Release\TrackerPatternEditAuditionTest.exe
      - name: Test accessible manual value input
        shell: pwsh
        run: .\build\Release\TrackerManualNumericTest.exe
      - name: Test Curve / Previous Value / Resolution / Ratio and F2 insertion
        shell: pwsh
        run: .\build\Release\TrackerCurvePreviousTest.exe
      - name: Test MIDI Pattern mapping, step recording, Sub Notes and release
        shell: pwsh
        run: .\build\Release\TrackerMidiFeaturesTest.exe
      - name: Test portable Pattern-only library encoding and validation
        shell: pwsh
        run: .\build\Release\TrackerPatternTextTest.exe
      - name: Verify TEST0.2.39 native tracker library browser
        shell: pwsh
        run: python Tests/verify_test0233_native_library_browser.py
      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = "build/Biscot1_artefacts/Release/VST3/Biscot1 Synth.vst3"
          if (-not (Test-Path -LiteralPath $plugin)) { throw "VST3 bundle not found: $plugin" }
          Compress-Archive -LiteralPath $plugin -DestinationPath "Biscot1-TEST0.2.44-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Biscot1-TEST0.2.44-Windows-x64
          path: Biscot1-TEST0.2.44-Windows-x64.zip
          if-no-files-found: error
