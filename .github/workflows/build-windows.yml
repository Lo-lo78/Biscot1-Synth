name: Build Biscot1 VST3 Windows x64
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSFX parameter map
        shell: pwsh
        run: python Tests/verify_catalog.py
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 4
      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = "build/Biscot1_artefacts/Release/VST3/Biscot1 Synth.vst3"
          if (-not (Test-Path -LiteralPath $plugin)) { throw "VST3 bundle not found: $plugin" }
          Compress-Archive -LiteralPath $plugin -DestinationPath "Biscot1-TEST0.1-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Biscot1-TEST0.1-Windows-x64
          path: Biscot1-TEST0.1-Windows-x64.zip
          if-no-files-found: error
