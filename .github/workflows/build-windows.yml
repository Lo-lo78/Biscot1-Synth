name: Build Biscot1 VST3 Windows x64
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022 # VS 2022; windows-latest currently uses VS 2026
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSFX parameter map
        shell: pwsh
        run: python Tests/verify_catalog.py
      - name: Validate editor structure and DSP coverage
        shell: pwsh
        run: python Tests/check_test02.py
      - name: Validate Windows build configuration
        shell: pwsh
        run: python Tests/verify_build_configuration.py
      - name: Validate JUCE 8 compiler compatibility fixes
        shell: pwsh
        run: python Tests/verify_test021_build_fixes.py
      - name: Validate output stage and navigation
        shell: pwsh
        run: python Tests/verify_test022.py
      - name: Validate MIDI pitch bend modes
        shell: pwsh
        run: python Tests/verify_pitch_bend_mode.py
      - name: Verify preset browser and accessible editor
        shell: pwsh
        run: python Tests/verify_test025.py
      - name: Verify Grid NVDA navigation speech
        shell: pwsh
        run: python Tests/verify_test0251_grid_speech.py
      - name: Validate MIDI held-note stack integration
        shell: pwsh
        run: python Tests/verify_test026_note_stack.py
      - name: Validate SID Seq memory integration
        shell: pwsh
        run: python Tests/verify_test027_sidseq.py
      - name: Validate per-operator sustain and ADSR migration
        shell: pwsh
        run: python Tests/verify_test028_sustain.py
      - name: Validate Chord master and sustained arpeggiators
        shell: pwsh
        run: python Tests/verify_test029_arp_chord_master.py
      - name: Validate quantized arp Trigger / Legato transport and Release
        shell: pwsh
        run: python Tests/verify_test0210_quantized_arp.py
      - name: Validate TEST0.2.13 arpeggiator transport and Release
        shell: pwsh
        run: python Tests/verify_test0211_arp_transport.py
      - name: Verify arpeggio clock during release
        shell: pwsh
        run: python Tests/verify_test0212_arp_release.py
      - name: Verify TEST0.2.13 smooth CC64 arpeggio release
        shell: pwsh
        run: python Tests/verify_test0213_pedal_click.py
      - name: Verify JSFX filter gate and LFO parity wiring
        shell: pwsh
        run: python Tests/verify_test0214_filter_lfo.py
      - name: Verify point 4 cold idle, Square PWM and focus routing
        shell: pwsh
        run: python Tests/verify_test0215_idle_pwm.py
      - name: Verify TEST0.2.18 idle and arp pool optimization
        shell: pwsh
        run: python Tests/verify_test0216_deep_idle.py
      - name: Verify LB-303-style silent accessible editor root
        shell: pwsh
        run: python Tests/verify_test0217_nvda_entry.py
      - name: Verify first parameter and persisted UI location
        shell: pwsh
        run: python Tests/verify_test02171_initial_selection.py
      - name: Verify native tracker integration and original DSP preservation
        shell: pwsh
        run: python Tests/verify_test0218_tracker.py
      - name: Verify TEST0.2.18.2 tracker keyboard search and selection
        shell: pwsh
        run: python Tests/verify_test02182_tracker_navigation.py
      - name: Verify Release test assertions are always executed
        shell: pwsh
        run: python Tests/verify_test02183_release_tests.py
      - name: Verify F1 clipboard keyboard routing and Lua navigation
        shell: pwsh
        run: python Tests/verify_test02184_f1_clipboard.py
      - name: Verify Pattern audio transport and F2 parameter event routing
        shell: pwsh
        run: python Tests/verify_test0219_pattern_play.py
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 4
      - name: Test JSFX SID filter and wavetable core
        shell: pwsh
        run: .\build\Release\SidCoreStandaloneTest.exe
      - name: Test MIDI Pitch Bend routing
        shell: pwsh
        run: .\build\Release\PitchBendRoutingTest.exe
      - name: Test MIDI held-note stacks, legato, chord routing
        shell: pwsh
        run: .\build\Release\SidMidiNoteStateTest.exe
      - name: Test JSFX SID Seq recording and clock
        shell: pwsh
        run: .\build\Release\SidSeqMemoryTest.exe
      - name: Test ADSR and per-operator sustain regression
        shell: pwsh
        run: .\build\Release\SidSustainPedalTest.exe
      - name: Test CC64 arp continuation and Chord master
        shell: pwsh
        run: .\build\Release\SidArpSustainTest.exe
      - name: Test clock quantization, musical Trigger and natural Release
        shell: pwsh
        run: .\build\Release\SidQuantizedArpTest.exe
      - name: Test SID Seq and classical arp continue through Release
        shell: pwsh
        run: .\build\Release\SidArpReleaseTest.exe
      - name: Test CC64 release pitch and classical arp memory continuity
        shell: pwsh
        run: .\build\Release\SidPedalReleaseContinuityTest.exe
      - name: Test JSFX LFO shapes, Delay, Trigger, One Shot and filter ADSR
        shell: pwsh
        run: .\build\Release\SidFilterLfoParityTest.exe
      - name: Test point 4 idle DSP and LFO Square PWM
        shell: pwsh
        run: .\build\Release\SidIdleAndSquarePwmTest.exe
      - name: Test zero-work idle and arp pool refresh
        shell: pwsh
        run: .\build\Release\SidDeepIdleCpuTest.exe
      - name: Test native Pattern memory and limits
        shell: pwsh
        run: .\build\Release\TrackerPatternBankTest.exe
      - name: Test F2 incremental search and F1 multi-step copy
        shell: pwsh
        run: .\build\Release\TrackerSearchStepTest.exe
      - name: Test F1 Windows Ctrl shortcut key mapping and full Pattern copy
        shell: pwsh
        run: .\build\Release\TrackerShortcutTest.exe
      - name: Test native tracker Pattern clock and cursor pause
        shell: pwsh
        run: .\build\Release\TrackerPatternPlaybackTest.exe
      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = "build/Biscot1_artefacts/Release/VST3/Biscot1 Synth.vst3"
          if (-not (Test-Path -LiteralPath $plugin)) { throw "VST3 bundle not found: $plugin" }
          Compress-Archive -LiteralPath $plugin -DestinationPath "Biscot1-TEST0.2.19-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Biscot1-TEST0.2.19-Windows-x64
          path: Biscot1-TEST0.2.19-Windows-x64.zip
          if-no-files-found: error
